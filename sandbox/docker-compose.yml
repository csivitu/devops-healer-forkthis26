version: '3.8'

# define the main application and database services for the local environment
services
  web:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: self_healing_app
    restart: unless-stopped
    environment:
      - DB_HOST=db
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=app_db
      - TZ=UTC
    # bind to the default postgres port so we can test it locally
    ports:
      - "5432:5432"

  db:
    image: postgres:13-alpine
    container_name: self_healing_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: app_db
      TZ: UTC
      PGTZ: UTC
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d app_db"]
      interval: 3s
      timeout: 3s
      retries: 5