version: '3.8'

# define the main application and database services for the local environment
services
  web:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: self_healing_app
    restart: unless-stopped
    environment:
      - DB_HOST=db
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=app_db

  db:
    image: postgres:13-alpine
    container_name: self_healing_db
    # publish on a random free host port so parallel runs do not collide
    ports:
      - "5432"
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: app_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d app_db"]
      interval: 3s
      timeout: 3s
      retries: 5