image: docker:20.10.16

stages:
    - build
    - integration-test
    - staging-deploy

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  POSTGRES_DB: app_db
  POSTGRES_USER: admin
  POSTGRES_PASSWORD: secret
  TZ: "UTC"

services:
    - docker:20.10.16-dind

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
        - .venv/
        - ./.cache/pip

build_binary:
  stage: build
  image: python:3.9-slim
  script:
        - echo "generating environment secrets"
        - echo "POSTGRES_DB=app_db" > .env
        - echo "POSTGRES_USER=admin" >> .env
        - pyinstaller --onefile app.py
  artifacts:
    paths:
            - .env
            - dist/app
    expire_in: 1 week

integration_test:
  stage: integration-test
  dependencies:
        - build_binary
  script:
        - docker-compose -f docker-compose.yml up -d --build
        - |
      echo "waiting for database..."
      for i in {1..30}; do
        if docker-compose logs db 2>&1 | grep -q "ready to accept connections"; then
          echo "database is ready"
          break
        fi
        sleep 1
        if [ $i -eq 30 ]; then
          echo "database timeout"
          exit 1
        fi
      done
        - docker-compose exec web pytest tests/

staging_deploy:
  stage: staging-deploy
  image: ubuntu:22.04
  script:
        - echo "preparing staging deployment"
        - sed -i 's/\r$//' ./deploy.sh
        - chmod +x ./deploy.sh
        - echo "executing deployment script"
        - ./deploy.sh
  environment:
    name: staging
