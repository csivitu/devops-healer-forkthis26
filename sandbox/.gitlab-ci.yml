image: docker:20.10.16

stages:
  - build
  - integration-test
  - staging-deploy

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  POSTGRES_DB: app_db
  POSTGRES_USER: admin
  POSTGRES_PASSWORD: secret

services:
  - docker:20.10.16-dind

cache:
  # store python packages so we do not have to download them on every single run
  key: "global-dependency-cache-v1"
  paths:
    - .venv/
    - ~/.cache/pip

build_binary:
  stage: build
  image: python:3.9-slim
  script:
    - echo "generating environment secrets"
    - echo "POSTGRES_DB=app_db" > .env
    - echo "POSTGRES_USER=admin" >> .env
    - pyinstaller --onefile app.py
  artifacts:
    paths:
      - .env
    expire_in: 1 week

integration_test:
  stage: integration-test
  script:
    - docker-compose -f docker-compose.yml up -d --build
    - |
      echo "waiting for database..."
      DB_READY=false
      for _ in $(seq 1 30); do
        if docker-compose logs db 2>&1 | grep -q "ready to accept connections"; then
          DB_READY=true
          break
        fi
        sleep 2
      done
      if [ "$DB_READY" = false ]; then
        echo "database timeout"
        exit 1
      fi
    - docker-compose exec web pytest tests/

staging_deploy:
  stage: staging-deploy
  image: ubuntu:22.04
  script:
    - echo "preparing staging deployment"
    - chmod +x ./deploy.sh
    - echo "executing deployment script"
    - ./deploy.sh
  environment:
    name: staging